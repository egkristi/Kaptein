[licenses]
# Kaptein itself is MIT OR Apache-2.0; dependencies may use any of these.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-DFS-2016", "MPL-2.0"]
confidence-threshold = 0.8

[advisories]
# Fail CI on known vulnerabilities (RUSTSEC advisories).
yanked = "deny"

[bans]
# Catch accidental duplicate versions of hot deps (e.g. tokio, serde, kube).
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
