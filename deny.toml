[licenses]
# Dependencies must use one of these licenses. Kaptein itself is BUSL-1.1
# (Business Source License) — this allow list governs third-party crates only.
# MPL-2.0 (file-level copyleft) is intentionally excluded to keep commercial
# relicensing clean.
#
# Note: unicode-ident is licensed "Unicode-3.0" (not Unicode-DFS-2016); add it
# when it appears. option-ext (MPL-2.0) is pulled in via dirs/directories and is
# intentionally NOT allowed — see CONTRIBUTING for the XDG-path plan.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Kaptein's own license (the four workspace crates).
    "BUSL-1.1",
    # webpki-root-certs (via rustls-platform-verifier -> kube-client).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
# Fail CI on known vulnerabilities (RUSTSEC advisories).
yanked = "deny"

[bans]
# Deny duplicate versions of hot deps; list known exceptions explicitly rather
# than warning on every build.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Unavoidable duplicate versions: different major lines required by different
# transitive dependencies. Re-review at each `cargo update`.
skip = [
    # 0.22 (k8s-openapi/kube) vs 0.23 (rmcp)
    "base64",
    # 0.2 (ring) vs 0.3 (ahash) vs 0.4
    "getrandom",
    "hashbrown",
    "linux-raw-sys",
    "rustix",
    "serde_core",
    "serde_json",
    # 0.26 (workspace pin) vs 0.28 (ratatui 0.30's derive)
    "strum",
    "strum_macros",
    "syn",
    "unicode-width",
    "windows-sys",
    "r-efi",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
