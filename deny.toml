[licenses]
# Dependencies must use one of these licenses. Kaptein itself is BUSL-1.1
# (Business Source License) — this allow list governs third-party crates only.
# MPL-2.0 (file-level copyleft) is intentionally excluded to keep commercial
# relicensing clean.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-DFS-2016"]
confidence-threshold = 0.8

[advisories]
# Fail CI on known vulnerabilities (RUSTSEC advisories).
yanked = "deny"

[bans]
# Catch accidental duplicate versions of hot deps (e.g. tokio, serde, kube).
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
