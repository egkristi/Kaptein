# Keycloak lens — a view definition (ADR-0004 tier 1, ADR-0012).
# MIT/Apache-2.0 (extension surface). Keycloak (keycloak-operator) signals readiness
# via the `Ready` condition on the Keycloak CR.

id: com.kaptein.keycloak-lens
api_version: 1
target:
  group: k8s.keycloak.org
  version: v2alpha1
  kind: Keycloak

columns:
  - id: name
    header_key: col.name
    kind: text
    sortable: true
    field: metadata.name
  - id: instances
    header_key: col.instances
    kind: number
    sortable: true
    field: spec.instances
  - id: status
    header_key: col.status
    kind: status
    sortable: true

conditions:
  - condition_type: Ready
    status: "True"
    level: ok
  - condition_type: Ready
    status: "False"
    level: error

actions:
  - id: describe
    label_key: action.describe
    state: allowed
