# Velero Backup lens — a view definition (ADR-0004 tier 1, ADR-0012).
# MIT/Apache-2.0 (extension surface). Velero Backups signal success via the `Ready`
# condition (True = backup completed successfully).

id: com.kaptein.velero-backup-lens
api_version: 1
target:
  group: velero.io
  version: v1
  kind: Backup

columns:
  - id: name
    header_key: col.name
    kind: text
    sortable: true
    field: metadata.name
  - id: status
    header_key: col.status
    kind: status
    sortable: true

conditions:
  - condition_type: Ready
    status: "True"
    level: ok
  - condition_type: Ready
    status: "False"
    level: error
  - condition_type: Ready
    status: Unknown
    level: pending

actions:
  - id: describe
    label_key: action.describe
    state: allowed
