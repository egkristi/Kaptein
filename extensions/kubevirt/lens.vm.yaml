# KubeVirt VirtualMachine lens — a view definition (ADR-0004 tier 1, ADR-0012).
# MIT/Apache-2.0 (extension surface). KubeVirt VMs signal guest readiness via the
# `Ready` condition; `Paused`/`Migrating` are informational.

id: com.kaptein.kubevirt-vm-lens
api_version: 1
target:
  group: kubevirt.io
  version: v1
  kind: VirtualMachine

columns:
  - id: name
    header_key: col.name
    kind: text
    sortable: true
  - id: status
    header_key: col.status
    kind: status
    sortable: true

conditions:
  - condition_type: Ready
    status: "True"
    level: ok
  - condition_type: Ready
    status: "False"
    level: error
  - condition_type: Paused
    status: "True"
    level: info
  - condition_type: Migrating
    status: "True"
    level: info

actions:
  - id: describe
    label_key: action.describe
    state: allowed
