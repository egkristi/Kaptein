# cert-manager Certificate lens — a view definition (ADR-0004 tier 1, ADR-0012).
# MIT/Apache-2.0 (extension surface). cert-manager signals issuance via the `Ready`
# condition; `Issuing`/`Renewing` are informational.

id: com.kaptein.cert-manager-certificate-lens
api_version: 1
target:
  group: cert-manager.io
  version: v1
  kind: Certificate

columns:
  - id: name
    header_key: col.name
    kind: text
    sortable: true
  - id: status
    header_key: col.status
    kind: status
    sortable: true

conditions:
  - condition_type: Ready
    status: "True"
    level: ok
  - condition_type: Ready
    status: "False"
    level: error
  - condition_type: Issuing
    status: "True"
    level: info
  - condition_type: Renewing
    status: "True"
    level: info

actions:
  - id: describe
    label_key: action.describe
    state: allowed
