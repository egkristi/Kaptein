name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must already be tagged and pushed)"
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (publish gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Publish in dependency order (leaf crates first so path+version deps
      # resolve at publish time), skipping crates already at this version. This
      # makes the workflow idempotent: re-pointing a tag (or a re-run) must not
      # fail with "crate@X.Y.Z already exists on crates.io index".
      #
      # `cargo publish` authenticates via CARGO_REGISTRY_TOKEN (no `--token`
      # flag and no `cargo login` — the latter prompts interactively for a token
      # and cannot be satisfied by the environment variable alone).
      - name: Publish crates (dependency order, idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > /tmp/meta.json
          for crate in kaptein-core kaptein-viewmodel kaptein-integration kaptein frontend-tui; do
            version="$(python3 -c 'import sys,json; m=json.load(open("/tmp/meta.json")); print(next(p["version"] for p in m["packages"] if p["name"]==sys.argv[1]))' "$crate")"
            # crates.io returns 200 for an existing version, 404 otherwise.
            if curl -fsSL -A "Kaptein publish (GitHub Actions)" \
                "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1; then
              echo "::notice::${crate}@${version} already published — skipping"
              continue
            fi
            echo "Publishing ${crate}@${version}"
            cargo publish -p "$crate"
          done
