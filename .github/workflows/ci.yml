name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  live:
    name: Live integration (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # M2.0b: latest-three-minors conformance — the live tier must pass on the
      # three most recent Kubernetes minors, not just one default. The node images
      # are pinned by digest (kind requires the `@sha256` for reproducibility and
      # so an image is guaranteed to match this release).
      matrix:
        include:
          - k8s: v1.37.0
            node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - k8s: v1.36.4
            node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - k8s: v1.35.8
            node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # M2.0b: the live integration tier (`crates/kaptein-core/tests/live.rs`,
      # gated on `KAPTEIN_LIVE_TESTS=1`) must actually run in CI against a real
      # API server, not just remain a hermetic-gated file. A throwaway `kind`
      # cluster provides that server without touching any shared state.
      # `version` is pinned to a kind release new enough to generate the
      # kubeadm config API that v1.37 accepts (v0.31.0 emits v1beta3, which
      # kubeadm 1.37 rejects).
      - uses: helm/kind-action@v1
        with:
          cluster_name: kaptein-it
          version: v0.33.0
          node_image: ${{ matrix.node_image }}
      - name: Wait for the API server
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
      - name: Run the live integration tier
        env:
          KAPTEIN_LIVE_TESTS: "1"
        run: cargo test -p kaptein-core --test live --locked

      - name: Run the live CLI tier
        env:
          KAPTEIN_LIVE_TESTS: "1"
        run: |
          cargo test --locked -p kaptein -- delete_confirm_round_trips_through_the_cli
          cargo test --locked -p kaptein -- governance_check_runs_real_preflight_against_a_live_server

  bench:
    name: Perf budget (M1.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The M1.8 budget is *measured*, not aspirational: the benches run in release
      # mode and exit non-zero on a regression (the budget lives in the bench, not in
      # CI). Two suites: the view-model render hot spots (50 000-row plane) and the
      # core Kubernetes-side hot paths (store apply / watchring / redaction).
      - run: cargo bench -p kaptein-viewmodel --bench query --locked
      - run: cargo bench -p kaptein-core --bench core_paths --locked

  msrv:
    name: MSRV (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain override: rustup honors `rust-toolchain.toml`, pinning to the MSRV.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  stable:
    name: Stable (latest)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml so this job genuinely runs on latest stable,
      # catching breakage before the MSRV bump (see rust-toolchain.toml policy).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  wasm:
    name: WASM (view-model target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pin to the toolchain from rust-toolchain.toml so the wasm target is
          # installed for the *pinned* toolchain (not `stable`), avoiding E0463
          # "can't find crate for std" from the toolchain mismatch.
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The view-model must be wasm-compatible from day one: the browser UI consumes
      # it, and this is where a non-wasm dependency (mio via tokio rt-multi-thread,
      # std::time::Instant misuse, etc.) will actually break first.
      - run: cargo build -p kaptein-viewmodel --target wasm32-unknown-unknown --locked

  layers:
    name: Layer dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > /tmp/meta.json
          # Enforce the one-directional dependency rule (ADR / AGENTS.md):
          # no frontend may depend on kaptein-core directly.
          # They reach it only through kaptein-viewmodel.
          python3 - <<'PY'
          import json
          meta = json.load(open("/tmp/meta.json"))
          packages = {p["name"]: p for p in meta["packages"]}
          # Enforce the one-directional dependency rule (ADR / AGENTS.md): no
          # frontend (renderer) may depend on kaptein-core directly — they reach
          # it only through kaptein-integration, which owns and re-exports core.
          # The list is derived from workspace metadata (not hardcoded), so a new
          # renderer crate is covered automatically. `kaptein-cli` is exempt:
          # it is a thin CLI projection that drives core directly, not a renderer.
          frontends = [p["name"] for p in meta["packages"] if p["name"].startswith("frontend-") or p["name"] == "kaptein-tui"]
          for name in frontends:
              deps = {d["name"] for d in packages[name].get("dependencies", [])}
              if "kaptein-core" in deps:
                  raise SystemExit(f"{name} must not depend on kaptein-core directly")
          print(f"Layer dependency rule satisfied ({len(frontends)} frontend crate(s))")
          PY

      # Enforce the "semantics vs geometry" rule at the source level: a frontend must
      # not import a `kaptein_core::discovery` type for sorting/filtering (the view-model
      # owns that meaning — AGENTS.md "frontends render, never compute"). The core-side
      # sort/filter duplicate (`SortKey`/`sort_summaries`/`filter_summaries`/`list_with`)
      # was removed (issue #32), so this grep is a tripwire: if any of those symbols ever
      # reappear in a frontend, or a frontend reaches for the `SortSpec`/sort semantics
      # via core, CI fails.
      - run: |
          set -euo pipefail
          if grep -rn "kaptein_core::discovery::SortKey\|kaptein_core::discovery::sort_summaries\|kaptein_core::discovery::filter_summaries\|kaptein_core::discovery::list_with" crates/kaptein-tui crates/frontend-* 2>/dev/null; then
            echo "error: a frontend uses core::discovery sort/filter types — sort/filter is view-model semantics (AGENTS.md)" >&2
            exit 1
          fi
          echo "Frontends do not use core::discovery sort/filter types"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  dist:
    name: Distribution artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          # The install script must be valid bash and executable.
          bash -n install.sh
          test -x install.sh || { echo "install.sh must be executable"; exit 1; }
          # The Krew plugin manifest must be valid YAML with a version + one
          # platform entry per release target. The committed template carries
          # PLACEHOLDER_* values that the release workflow renders; CI must NOT
          # treat those placeholders as a valid manifest (issue #23).
          python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open("krew/kaptein.yaml"))
          assert m["apiVersion"].startswith("krew.googlecontainertools.github.com"), "Krew apiVersion"
          assert m["kind"] == "Plugin", "Krew kind"
          assert m["spec"]["version"], "Krew version"
          platforms = m["spec"]["platforms"]
          assert len(platforms) == 4, f"expected 4 platforms, got {len(platforms)}"
          for p in platforms:
              assert p["uri"] and p["sha256"] and p["bin"], "platform uri/sha256/bin"
              # The committed template is a *template*: `PLACEHOLDER_*` tokens (in the
              # version or the sha256s) are expected here and rendered at release time.
              # Assert the values are non-empty and any placeholder token is well-formed
              # (a `PLACEHOLDER_` prefix, never a bare `PLACEHOLDER`).
              import re as _re
              for v in (p["uri"], p["sha256"]):
                  assert v, "empty uri/sha256"
                  if "PLACEHOLDER" in v:
                      assert _re.search(r"PLACEHOLDER_[A-Za-z0-9_]+", v), \
                          f"malformed placeholder in {v!r}"
          print(f"Krew template valid ({len(platforms)} platforms)")
          PY
          # The Dockerfile must be present and pin a version arg.
          grep -q "ARG KAPTEIN_VERSION" Dockerfile || { echo "Dockerfile missing version arg"; exit 1; }
          echo "Distribution artifacts OK"

  version-sync:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The release "Distribution & release sync" DoD: the workspace version and the
      # user-facing version pins (README/install.sh/Dockerfile/INSTALL) must not drift —
      # the review found "five releases of drift". The set is *derived* (the workspace
      # `version` from `Cargo.toml` is the single source of truth; every `v<version>`
      # pin in the user-facing files must equal it), so a future release that bumps the
      # crate but forgets a doc can't ship silently.
      - run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag="v${version}"
          missing=0
          for f in README.md install.sh Dockerfile docs/INSTALL.md; do
            if ! grep -qF "$tag" "$f"; then
              echo "error: $f does not reference $tag (workspace version $version)" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "error: user-facing version pins drifted from the workspace version" >&2
            exit 1
          fi
          echo "Version pins consistent at $tag"
