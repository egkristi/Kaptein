name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV (pinned toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No toolchain override: rustup honors `rust-toolchain.toml`, pinning to the MSRV.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  stable:
    name: Stable (latest)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml so this job genuinely runs on latest stable,
      # catching breakage before the MSRV bump (see rust-toolchain.toml policy).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  wasm:
    name: WASM (view-model target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pin to the toolchain from rust-toolchain.toml so the wasm target is
          # installed for the *pinned* toolchain (not `stable`), avoiding E0463
          # "can't find crate for std" from the toolchain mismatch.
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The view-model must be wasm-compatible from day one: the browser UI consumes
      # it, and this is where a non-wasm dependency (mio via tokio rt-multi-thread,
      # std::time::Instant misuse, etc.) will actually break first.
      - run: cargo build -p kaptein-viewmodel --target wasm32-unknown-unknown --locked

  layers:
    name: Layer dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > /tmp/meta.json
          # Enforce the one-directional dependency rule (ADR / AGENTS.md):
          # no frontend may depend on kaptein-core directly.
          # They reach it only through kaptein-viewmodel.
          python3 - <<'PY'
          import json
          meta = json.load(open("/tmp/meta.json"))
          packages = {p["name"]: p for p in meta["packages"]}
          # Enforce the one-directional dependency rule (ADR / AGENTS.md): no
          # frontend (renderer) may depend on kaptein-core directly — they reach
          # it only through kaptein-integration, which owns and re-exports core.
          # The list is derived from workspace metadata (not hardcoded), so a new
          # `frontend-*` crate is covered automatically. `kaptein-cli` is exempt:
          # it is a thin CLI projection that drives core directly, not a renderer.
          frontends = [p["name"] for p in meta["packages"] if p["name"].startswith("frontend-")]
          for name in frontends:
              deps = {d["name"] for d in packages[name].get("dependencies", [])}
              if "kaptein-core" in deps:
                  raise SystemExit(f"{name} must not depend on kaptein-core directly")
          print(f"Layer dependency rule satisfied ({len(frontends)} frontend crate(s))")
          PY

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  dist:
    name: Distribution artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          # The install script must be valid bash and executable.
          bash -n install.sh
          test -x install.sh || { echo "install.sh must be executable"; exit 1; }
          # The Krew plugin manifest must be valid YAML with a version + one
          # platform entry per release target.
          python3 - <<'PY'
          import yaml
          m = yaml.safe_load(open("krew/kaptein.yaml"))
          assert m["apiVersion"].startswith("krew.googlecontainers.com"), "Krew apiVersion"
          assert m["kind"] == "Plugin", "Krew kind"
          assert m["spec"]["version"], "Krew version"
          platforms = m["spec"]["platforms"]
          assert len(platforms) == 4, f"expected 4 platforms, got {len(platforms)}"
          for p in platforms:
              assert p["uri"] and p["sha256"] and p["bin"], "platform uri/sha256/bin"
          print(f"Krew manifest valid ({len(platforms)} platforms)")
          PY
          # The Dockerfile must be present and pin a version arg.
          grep -q "ARG KAPTEIN_VERSION" Dockerfile || { echo "Dockerfile missing version arg"; exit 1; }
          echo "Distribution artifacts OK"
