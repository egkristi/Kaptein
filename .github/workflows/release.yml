name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Pin to the toolchain from rust-toolchain.toml so the cross-compile
          # target's std is installed for the *pinned* toolchain, avoiding E0463
          # "can't find crate for std" from the toolchain mismatch.
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Cross-compiling to aarch64-linux-gnu requires a linker (gcc-aarch64).
      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binaries
        run: cargo build --release --locked -p kaptein -p frontend-tui --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kaptein dist/
          cp target/${{ matrix.target }}/release/kaptein-tui dist/
          tar -czf kaptein-${{ matrix.target }}.tar.gz -C dist kaptein kaptein-tui

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/kaptein.exe dist/
          cp target/${{ matrix.target }}/release/kaptein-tui.exe dist/
          cd dist && 7z a ../kaptein-${{ matrix.target }}.zip kaptein.exe kaptein-tui.exe

      - uses: actions/upload-artifact@v7
        with:
          name: kaptein-${{ matrix.target }}
          path: |
            kaptein-${{ matrix.target }}.tar.gz
            kaptein-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub release (checksums + signatures)
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: write
      # OIDC token for cosign keyless signing (Fulcio/Rekor).
      id-token: write
    steps:
      # The signing step and `gh release upload` need the repo checked out (a `.git`
      # directory) and the tag context.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Flatten artifacts + compute checksums
        run: |
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 -I{} cp {} .
          # SHA256SUMS (review item #5): every artifact is checksummed so users can
          # verify a download byte-for-byte before trusting it.
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      # Render the Krew plugin manifest at release time: substitute the tag and the
      # per-platform sha256 checksums (computed above) into the template placeholders,
      # so `kubectl krew install kaptein` points at real, checksum-verified artifacts
      # (issue #23 — the committed template ships placeholders, which CI must not treat
      # as a valid manifest).
      - name: Render Krew manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"  # e.g. v0.27.0
          sha() { grep "  kaptein-$1.tar.gz$" SHA256SUMS | awk '{print $1}'; }
          sed \
            -e "s/PLACEHOLDER_VERSION/${VERSION}/g" \
            -e "s/PLACEHOLDER_LINUX_AMD64_SHA256/$(sha x86_64-unknown-linux-gnu)/" \
            -e "s/PLACEHOLDER_LINUX_ARM64_SHA256/$(sha aarch64-unknown-linux-gnu)/" \
            -e "s/PLACEHOLDER_DARWIN_AMD64_SHA256/$(sha x86_64-apple-darwin)/" \
            -e "s/PLACEHOLDER_DARWIN_ARM64_SHA256/$(sha aarch64-apple-darwin)/" \
            krew/kaptein.yaml > kaptein.yaml
          # Fail loudly if any placeholder survived (a missing checksum would ship a
          # broken manifest).
          if grep -q 'PLACEHOLDER' kaptein.yaml; then
            echo "error: unreplaced placeholder in rendered Krew manifest" >&2
            exit 1
          fi
          cat kaptein.yaml

      - name: Sign artifacts with cosign (keyless)
        run: |
          set -euo pipefail
          # Sign each artifact and the checksums file. Keyless signing uses the
          # GitHub Actions OIDC identity (Fulcio) and records to Rekor. Modern
          # cosign writes a single `.bundle` (containing the signature + certificate),
          # and the `--output-signature`/`--output-certificate` flags are deprecated
          # and ignored under the new bundle format — so we write only the bundle.
          for f in *.tar.gz *.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
          ls -la

      - name: Upload artifacts + signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag push does not create a GitHub release on its own — create it
          # (idempotent: `|| true` tolerates an already-existing release), then
          # attach binaries, checksums, and cosign signature bundles.
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" \
            *.tar.gz *.zip SHA256SUMS *.bundle kaptein.yaml --clobber

      # Generate the SLSA subject digest for the generic generator. The generator
      # attests to these exact artifact bytes; consumers verify provenance with
      # `slsa-verifier` against the artifact they downloaded.
      - name: Generate SLSA subject hashes
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum *.tar.gz *.zip SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC token so the SBOM can be cosign-attested and linked to the
      # binaries it describes (an unsigned SBOM is unverifiable supply-chain
      # metadata).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Generate a CycloneDX SBOM from the Rust dependency graph (cargo-cyclonedx),
      # so the SBOM names the exact crate/version set that shipped.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json --spec-version 1.5

      # Sign the SBOM so it can be verified against the same GitHub Actions OIDC
      # identity as the binaries (SECURITY.md's "Verifying a release" section).
      # `cargo cyclonedx` writes per-crate `*.cdx.json` files under `target/`, so
      # we sign them in place (recursively) rather than relying on a top-level glob.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign SBOM with cosign (keyless)
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done < <(find . -name '*.cdx.json' -print0)

      - name: Upload SBOM (and signature) to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes || true
          find . -name '*.cdx.json' -print0 \
            | xargs -0 -I{} gh release upload "${GITHUB_REF_NAME}" {} --clobber
          find . -name '*.cdx.json.bundle' -print0 \
            | xargs -0 -I{} gh release upload "${GITHUB_REF_NAME}" {} --clobber

  provenance:
    name: SLSA provenance
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # Needed to detect the GitHub Actions environment and read the workflow
      # definition that produced the artifacts.
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      # Attach the signed provenance to the tagged GitHub release.
      upload-assets: true
