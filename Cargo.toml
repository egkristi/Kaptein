[workspace]
resolver = "3"
members = [
    "crates/kaptein-core",
    "crates/kaptein-viewmodel",
    "crates/frontend-tui",
    "crates/frontend-gui",
    "crates/headless",
    "crates/serve",
    "crates/plugins",
    "crates/viewdef",
    "crates/ext-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BUSL-1.1"
repository = "https://github.com/egkristi/Kaptein"
authors = ["Kaptein contributors"]

[workspace.dependencies]
# Shared dependency versions live here and are referenced by the crates that need
# them (e.g. kaptein-core = { path = "crates/kaptein-core" }). Kept empty for the
# initial scaffold; dependencies are added as each crate is implemented.

[profile.release]
lto = true
codegen-units = 1
strip = true
