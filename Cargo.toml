[workspace]
resolver = "3"
members = [
    "crates/kaptein-core",
    "crates/kaptein-viewmodel",
    "crates/kaptein-integration",
    "crates/frontend-tui",
    "crates/kaptein-cli",
]

[workspace.package]
version = "0.27.0"
edition = "2024"
rust-version = "1.97"
license = "BUSL-1.1"
repository = "https://github.com/egkristi/Kaptein"
homepage = "https://kaptein.io"
authors = ["Kaptein contributors"]

[workspace.dependencies]
# Shared dependency versions, referenced by crates via `foo = { workspace = true }`.
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
futures-util = "0.3"
futures-channel = "0.3"
thiserror = "2"
strum = { version = "0.26", features = ["derive"] }
kube = { version = "4", default-features = false, features = ["client", "config", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["rt", "macros"] }

[workspace.lints.rust]
# Enforced centrally rather than repeated as `#![forbid(unsafe_code)]` per crate.
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
