# Krew plugin manifest for Kaptein — the `kubectl krew install kaptein` entry
# point (Distribution & release sync, ROADMAP.md).
#
# Krew installs a *single* binary named after the plugin into
# ~/.krew/bin/kubectl-kaptein. Kaptein is one static binary: the TUI is `kaptein
# tui` (not a separate executable), so the Krew-installed `kubectl kaptein` gives
# you the full CLI including the TUI subcommand.
#
# NOTE: this file is a *template*. The version and per-platform sha256 tokens are
# substituted at release time (see .github/workflows/release.yml) and the rendered
# manifest is uploaded to the release as `kaptein.yaml`. To install via Krew, use the
# custom index (github.com/egkristi/krew-index) or the release manifest directly:
#   kubectl krew install --manifest-url=https://github.com/egkristi/Kaptein/releases/latest/download/kaptein.yaml
# The central krew-index (github.com/kubernetes-sigs/krew-index) requires OSI-approved
# open source, so a BUSL-1.1 plugin is not submitted there — see issue #34 and the
# "Distribution" section of ROADMAP.md.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kaptein
spec:
  version: PLACEHOLDER_VERSION
  homepage: https://kaptein.io
  shortDescription: >-
    A Kubernetes workbench: governed read-only access, diagnostics, and lens-driven
    views for any CRD.
  description: >-
    Kaptein is a unified Kubernetes workbench — terminal UI, GUI, and headless
    agent over one renderer-agnostic domain layer. This plugin exposes the CLI
    (governed MCP server, diagnostics, describe/list/logs, RBAC preflight, and the
    dry-run gated write path).
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/egkristi/Kaptein/releases/download/PLACEHOLDER_VERSION/kaptein-x86_64-unknown-linux-gnu.tar.gz
      sha256: PLACEHOLDER_LINUX_AMD64_SHA256
      bin: kaptein
      files:
        - from: kaptein
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/egkristi/Kaptein/releases/download/PLACEHOLDER_VERSION/kaptein-aarch64-unknown-linux-gnu.tar.gz
      sha256: PLACEHOLDER_LINUX_ARM64_SHA256
      bin: kaptein
      files:
        - from: kaptein
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/egkristi/Kaptein/releases/download/PLACEHOLDER_VERSION/kaptein-x86_64-apple-darwin.tar.gz
      sha256: PLACEHOLDER_DARWIN_AMD64_SHA256
      bin: kaptein
      files:
        - from: kaptein
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/egkristi/Kaptein/releases/download/PLACEHOLDER_VERSION/kaptein-aarch64-apple-darwin.tar.gz
      sha256: PLACEHOLDER_DARWIN_ARM64_SHA256
      bin: kaptein
      files:
        - from: kaptein
          to: .
