[package]
name = "frontend-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Kaptein ratatui terminal frontend"

[[bin]]
name = "kaptein-tui"
path = "src/main.rs"

[dependencies]
kaptein-viewmodel = { version = "0.28.2", path = "../kaptein-viewmodel" }
kaptein-integration = { version = "0.28.2", path = "../kaptein-integration" }
kube = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ratatui = "0.30"
crossterm = "0.29"
