[package]
name = "frontend-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kaptein ratatui terminal frontend"

[[bin]]
name = "kaptein-tui"
path = "src/main.rs"

[dependencies]
kaptein-viewmodel = { version = "0.7.0", path = "../kaptein-viewmodel" }
kaptein-core = { version = "0.7.0", path = "../kaptein-core" }
kube = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ratatui = "0.29"
crossterm = "0.28"
