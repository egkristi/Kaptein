[package]
name = "kaptein-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Kaptein core: kube-rs client, watchers/reflectors, CRD discovery, stores"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
toml = "0.8"
regex = "1"
serde_yaml = "0.9"
serde_json = "1"
secrecy = "0.10"

# Kubernetes-side hot-path benchmark (store apply, watchring, redaction) — the core
# companion to the view-model `query` bench. Dependency-free (`harness = false`, no
# criterion) and budget-gated by exit code, so CI fails on regression.
[[bench]]
name = "core_paths"
harness = false
