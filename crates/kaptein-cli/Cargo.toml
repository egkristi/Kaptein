[package]
name = "kaptein"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Kaptein CLI"
default-run = "kaptein"

[[bin]]
name = "kaptein"
path = "src/main.rs"

[dependencies]
kaptein-core = { version = "0.29.0", path = "../kaptein-core" }
kaptein-viewmodel = { version = "0.29.0", path = "../kaptein-viewmodel" }
kube = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
futures-util = { workspace = true }
clap = { version = "4", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
rmcp = { version = "3", features = ["server", "transport-io"] }
serde_json = "1"
regex = "1"
serde_yaml = "0.9"
