[package]
name = "kaptein-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Kaptein integration layer: binds kaptein-core to frontends, mapping core errors to a user-facing form"

[dependencies]
kaptein-core = { version = "0.30.0", path = "../kaptein-core" }
kaptein-viewmodel = { version = "0.30.0", path = "../kaptein-viewmodel" }
kube = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
k8s-openapi = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
http = "1"
